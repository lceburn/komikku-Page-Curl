name: Build fork APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # getCommitCount() in the build needs the full history, not a shallow clone.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.1" "platform-tools"

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Format gate
        run: ./gradlew spotlessCheck --no-daemon

      - name: Build debug APKs
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: komikku-pagecurl-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
